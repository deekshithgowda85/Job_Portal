# ═══════════════════════════════════════════════════════════════════════════════
# companies.yaml  —  Company Registry
#
# EDIT THIS FILE freely — the crawler re-reads it on every run.
# No restart needed.
#
# HOW TO ADD A COMPANY:
#
#   workday  →  find URL pattern: https://{tenant}.wd5.myworkdayjobs.com/...
#               add:  - company: "Name"
#                       tenant: "tenantslug"
#                       site: "External"
#
#   greenhouse  →  from boards.greenhouse.io/{board_token}
#                  add:  - company: "Name"
#                           board_token: "slug"
#
#   lever  →  from jobs.lever.co/{lever_id}
#             add:  - company: "Name"
#                     lever_id: "slug"
#
#   ashby  →  from jobs.ashbyhq.com/{ashby_slug}
#             add:  - company: "Name"
#                     ashby_slug: "slug"
#
#   linkedin  →  keyword + location search (Playwright)
#                add:  - company: "label_for_logs"
#                        keywords: "java developer"
#                        location: "Bangalore"
#
#   naukri  →  keyword + location + experience (Playwright)
#              add:  - company: "label_for_logs"
#                      keywords: "java developer"
#                      location: "Bangalore"
#                      experience: "0"
# ═══════════════════════════════════════════════════════════════════════════════


